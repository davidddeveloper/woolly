<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#FFF8EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Woolly" />
    <meta name="description" content="Log income, spending, savings, investments and family generosity with Penny the sheep." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Woolly</title>
    <!-- Penny is the first thing on screen: fetch her alongside the JS, not after it. -->
    <link rel="preload" as="image" href="/penny.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/penny-blink.webp" type="image/webp" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #fff8ee; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash; React replaces it on first render with the same Penny. -->
      <div style="height: 100%; display: grid; place-items: center">
        <img src="/penny.webp" width="140" height="182" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
